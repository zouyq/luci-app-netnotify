name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: src/go.sum

      - name: Go test
        run: go test ./...

      - name: Go vet
        run: go vet ./...

  build:
    name: Build (${{ matrix.goarch }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
          - goos: linux
            goarch: arm64
            suffix: linux-arm64
          - goos: linux
            goarch: arm
            goarm: "7"
            suffix: linux-armv7
          - goos: linux
            goarch: mipsle
            gomips: softfloat
            suffix: linux-mipsle
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: src/go.sum

      - name: Cross compile
        working-directory: src
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          GOMIPS: ${{ matrix.gomips }}
        run: |
          go build -trimpath -ldflags="-s -w" \
            -o "../bin/netnotifyd-${{ matrix.suffix }}" \
            ./cmd/netnotifyd
          ls -la "../bin/netnotifyd-${{ matrix.suffix }}"

      - uses: actions/upload-artifact@v4
        with:
          name: netnotifyd-${{ matrix.suffix }}
          path: bin/netnotifyd-${{ matrix.suffix }}
          if-no-files-found: error
